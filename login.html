<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetConnect - Iniciar Sesión</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23002b49'/><path d='M30 40 Q50 20 70 40 Q50 60 30 40 Z' fill='%23e30613'/><circle cx='50' cy='50' r='12' fill='%23c5a059'/></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;"></div>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-unab sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <span class="badge bg-danger rounded-pill px-2">UNAB</span>
                <span>VetConnect</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="mascotas.html">Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link" href="consultas.html">Consultas</a></li>
                    <li class="nav-item"><a class="nav-link" href="vacunas.html">Vacunas</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-auto py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card card-unab card-accent-navy mt-3">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <span class="badge badge-unab-navy px-3 py-1 rounded-pill mb-2">Autenticación</span>
                            <h3 class="h4 fw-bold mb-1">Iniciar sesión[cite: 1]</h3>
                            <p class="text-muted small">Acceso al panel administrativo</p>
                        </div>
                        
                        <form id="formLogin" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="loginCorreo" class="form-label fw-semibold">Correo[cite: 1]</label>
                                <input type="email" class="form-control" id="loginCorreo" placeholder="usuario@unab.cl" required>
                                <div class="invalid-feedback">Por favor introduce tu correo.</div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Contraseña[cite: 1]</label>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                <div class="invalid-feedback">Por favor ingresa tu contraseña.</div>
                            </div>
                            <button type="submit" class="btn btn-unab-primary w-100 py-2">Ingresar[cite: 1]</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-3 mt-auto border-top border-danger border-3">
        <div class="container text-center">
            <span class="small">&copy; 2026 Universidad Andrés Bello - VetConnect.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
